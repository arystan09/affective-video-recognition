name: CPU scientific contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --extra inspection --python 3.11
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m mypy
      - run: uv run --locked python -m pytest
      - run: uv run --locked python scripts/check_data_safety.py
      - run: uv run --locked python scripts/validate_config.py --config configs/data.yaml
      - run: uv run --locked python scripts/synthetic_run.py --config configs/data.yaml
      - run: uv run --locked python scripts/synthetic_run.py --config configs/data.yaml --irregular
